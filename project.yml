name: BankingDTT
options:
  bundleIdPrefix: com.taidt1404
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  BankingDTT:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BankingApp
    settings:
      base:
        PRODUCT_NAME: BankingDTT
        PRODUCT_MODULE_NAME: BankingDTT
        PRODUCT_BUNDLE_IDENTIFIER: com.taidt1404.BankingDTT
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Banking DTT"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Lưu và xem lại ảnh chụp biên lai chuyển khoản."
  BankingDTTTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BankingAppTests
    dependencies:
      - target: BankingDTT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.taidt1404.BankingDTTTests
schemes:
  BankingDTT:
    build:
      targets:
        BankingDTT: all
        BankingDTTTests: [test]
    test:
      targets:
        - BankingDTTTests
