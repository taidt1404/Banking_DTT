name: Build & Test iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Package Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run Unit Tests on iOS Simulator
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available iPhone -j | python3 -c "import sys,json; devs=[d for r in json.load(sys.stdin)['devices'].values() for d in r if d.get('isAvailable') and 'iPhone' in d.get('name','')]; print(devs[0]['udid'])")
          echo "Using Simulator UDID: $SIM_ID"
          xcodebuild test \
            -project BankingDTT.xcodeproj \
            -scheme BankingDTT \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Unsigned iOS Archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project BankingDTT.xcodeproj \
            -scheme BankingDTT \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BankingDTT.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/BankingDTT.xcarchive/Products/Applications/BankingDTT.app build/Payload/
          cd build
          zip -r BankingDTT-unsigned.ipa Payload
          ls -lh BankingDTT-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankingDTT-unsigned-ipa
          path: build/BankingDTT-unsigned.ipa
          retention-days: 30
