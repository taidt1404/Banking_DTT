name: Build & Test iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Package Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run Unit Tests on iOS Simulator
        run: |
          mkdir -p build
          SIM_ID=$(xcrun simctl list devices available iPhone -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devs in data.get("devices", {}).items():
              if "iOS-" in runtime:
                  for d in devs:
                      if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                          candidates.append((runtime, d["name"], d["udid"]))
          candidates.sort(reverse=True)
          print(candidates[0][2])
          ')
          echo "Using Simulator UDID: $SIM_ID"
          set -o pipefail
          xcodebuild test \
            -project BankingDTT.xcodeproj \
            -scheme BankingDTT \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            2>&1 | tee build/test.log

      - name: Report Test/Build Failure Annotations
        if: failure()
        run: |
          if [ -f build/test.log ]; then
            grep -E "error:|fatal error:|Test Case .* failed|FAILED" build/test.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 30 build/test.log | while IFS= read -r line; do
              echo "::notice::$line"
            done
          fi

      - name: Build Unsigned iOS Archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project BankingDTT.xcodeproj \
            -scheme BankingDTT \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BankingDTT.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/archive.log

      - name: Report Archive Failure Annotations
        if: failure()
        run: |
          if [ -f build/archive.log ]; then
            grep -E "error:|fatal error:" build/archive.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/BankingDTT.xcarchive/Products/Applications/BankingDTT.app build/Payload/
          cd build
          zip -r BankingDTT-unsigned.ipa Payload
          ls -lh BankingDTT-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankingDTT-unsigned-ipa
          path: build/BankingDTT-unsigned.ipa
          retention-days: 30

      - name: Publish Unsigned IPA to Latest Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          TITLE="BankingDTT Latest Build"
          NOTES="Bản build tự động từ commit ${GITHUB_SHA::7}. Tải trực tiếp \`BankingDTT-unsigned.ipa\` trên Safari iPhone và cài bằng SideStore."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/BankingDTT-unsigned.ipa --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" build/BankingDTT-unsigned.ipa --title "$TITLE" --notes "$NOTES"
          fi
